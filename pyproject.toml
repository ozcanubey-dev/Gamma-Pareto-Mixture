[build-system]
requires = ["uv_build >= 0.9.26, <0.10.0"]
build-backend = "uv_build"

[project]
name = "gamma_pareto_mixture"
version = "1.0.3"
authors = [
  { name="Ubeydullah Ozcan", email="ozcanubey.dev@gmail.com" },
]
description = "Gamma Pareto Mixture Disctribution"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "numpy",
    "pandas",
    "polars",
    "scipy",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/ozcanubey-dev/Gamma-Pareto-Mixture"
Issues = "https://github.com/ozcanubey-dev/Gamma-Pareto-Mixture/issues"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
